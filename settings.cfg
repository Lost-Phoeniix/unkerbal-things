// Unkerbal Things settings
// Two creatures: the Moho creature (Moho and Eve, on the ground) and the Laythe leviathan (deep in Laythe's sea).
// Delete a line to use its default.
// Automatic encounters: every randomCheckSeconds each creature that can appear here gets one roll; one creature at a time.
randomEncounters = true
randomCheckSeconds = 45

randomCooldownSeconds = 1800

// Testing tools: a toolbar button with force spawners, scare/Dread buttons, live creature state and the locator. Off for normal play (no toolbar button).
debugTools = false
// Ctrl+Alt+U opens and closes the same testing window in flight, with or without the toolbar button. false: no hotkey.
debugHotkey = true
// Shows the creature blip, range and chase state in the lower-right corner (also a toggle in the toolbar window).
creatureDebugRadar = false

// Master switch for the optional BDArmory Continued integration. The mod has
// no BDArmory dependency and works normally when BDA is absent.
bdArmoryCompatibility = true

// If BDArmory Continued is installed, publish active 3D creatures as moving
// GPS targets for GPS-guided weapons. They remain visual entities, so they
// are not ordinary radar-lockable vessels.
bdArmoryGpsTargets = true

// Makes active 3D creatures appear as contacts on BDArmory air-to-ground
// radar modules (including the APG-77 atg parts). Requires BDArmory.
bdArmoryGroundRadarTargets = true

// Lets BDArmory missiles and firing guns damage active 3D creatures.
// Missiles destroy the Moho creature in one hit; the leviathan needs several.
bdArmoryWeaponDamage = true

// The Moho creature appears on Moho and Eve, on the ground. It waits where it
// spawned, then begins its slower pursuit after it gets a clear view of you.
bulkEncounterChance = 0.20
bulkEncounterCooldownSeconds = 600

// The Laythe leviathan. It can spawn up to 10 km away and only hunts crafts deeper than bloopMinDepthMetres (below).
bloopEncounterChance = 0.14
bloopEncounterCooldownSeconds = 900

// --- Moho creature AI ---
// true: a target hovering up to hoverAttackMaxHeight above terrain is attacked by leaps; higher up the monster waits beneath it.
// false: ground monsters stall beneath anything 10 m or more above terrain (original).
hoverAttacks = true
hoverAttackMaxHeight = 60
// --- Attack sequence (Moho creature) ---
// true: a catch is a Windup (0.6-1.0 s, can be dodged by getting over twice the catch distance away or above the hover limit),
// a 0.3 s Lunge, then the vessel is torn apart part by part (outermost first, crew parts last) instead of exploding at once.
// false: instant catch (original).
attackSequences = true
// Seconds the tear-apart takes, spread over the parts being destroyed.
attackTearSeconds = 3
// true: attack sequences also shake the flight camera (works in fullscreen too; the window jolt is separate). Flight view only.
attackCameraShake = true
// --- Motion polish (visual only, Moho creature) ---
// true: limited turn rate, lean into acceleration/turns, distance-driven leg cycles, partial slope alignment.
// false: original instant facing and fixed-speed leg cycles.
smoothEntityMotion = true
// --- Scripted scares (harmless: nothing is damaged or killed) ---
// Master switch. false: none of the scares below ever happen.
scriptedScares = true
// Lit ModuleLight lights on the active vessel flicker ~2 s, stay off 5-15 s, then come back (night only).
scareLightsFail = true
// An eerie sound plus a garbled fake radio message.
scareRadioGlitch = true
// A false proximity warning message (the map contacts cannot be triggered on demand).
scareSensorGhost = true
// true: a real chase may trigger the lights scare once per chase (nothing else is allowed during a chase).
scareLightsDuringChase = true
// Seconds between scare rolls, chance per roll (0-1), and minimum seconds between scares.
scareCheckSeconds = 60
scareChance = 0.08
scareCooldownSeconds = 600
// --- Dread presentation (screen, sound, instruments; one hidden "menace" value drives all of it) ---
// MASTER SWITCH. false: none of the Dread features below exist and every hook behaves exactly as before Dread.
dreadEnabled = true
// Footsteps of walking monsters, heard only while landed on an airless body. Far = where they fade in (deep bass only), near = fully open.
dreadFootsteps = true
dreadFootstepsFarMetres = 2500
dreadFootstepsNearMetres = 30
// --- Recorded soundscape (airless bodies, orbit, below the surface). false: the synthesised sound everywhere, as before. ---
// In a vacuum only what touches the craft is heard: hull, ground, crunch, steps, landing impacts. Below the surface: water, hull under pressure, whales.
dreadSoundscape = true
// 0..2 overall gain. The trims move the steady bed and the single sounds in dB.
dreadSoundscapeVolume = 1
dreadSoundBedDb = 0
dreadSoundEventDb = 0
dreadSoundWhales = true
// Seconds the game's music takes to fade out when a monster appears (or the water scene starts); the threat sounds fade in over the same time. 0 = music untouched.
dreadSoundMusicFadeSeconds = 25
// Below this depth in metres the water scene starts (and the music fades); a monster nearby starts it at any depth.
dreadSoundWaterDepth = 100
// true: Moho has its quiet metal bed even with no monster about. false: silence and music until a monster spawns.
dreadSoundHauntedBed = false
// The Moho worm in the soundscape: its rumble through the ground while it travels under it (landed craft only), silence in the
// ambush dive, the ground bursting at the eruption, bodies pressing on the hull while it holds the craft, the structure failing at the
// kill. false: none of these (the soundscape as before).
dreadSoundWorm = true
// true: the old four-legged footsteps also play for the worm swarm body. false: no footsteps for it (it has no feet).
dreadFootstepsWorm = false
// Screen pass (Dread shader, D3D11 only; needs Shaders/dread.bundle, otherwise it is simply off).
dreadScreen = true
// 0..1 overall strength of the screen effect. 0 = no visible change.
dreadScreenStrength = 1
// onRenderImage (default; measured in KSP 1.12 D3D11) or commandBuffer (does NOT show on the flight camera: in-game difference at full menace was noise level).
dreadScreenMethod = onRenderImage
// Per-effect toggles. Signal covers noise, line tears, pixel dropouts and the edge colour split (external view only).
dreadGrade = true
dreadVignette = true
dreadGrain = true
dreadSignal = true
// Occasionally the external view holds its last frame for 0.4-1.2 s at high menace (never in final approach or docking).
dreadFeedFreeze = true
// Synthesised sound: drone, hull creaks and thumps, rare muffled creature, static.
dreadAudio = true
// 0..2 gain of the synthesised sound (the game's Ambience slider also applies).
dreadAudioVolume = 1
dreadDrone = true
dreadHullSounds = true
dreadCreature = true
dreadStatic = true
// Lower the game's music (through MusicLogic) up to this many dB at full menace; restored exactly. 6-12 is the design range.
dreadMusicDuck = true
dreadMusicDuckDb = 9
// Muffle everything (listener low-pass) as menace rises; removed again at zero menace. Cutoff in Hz at full menace.
dreadListenerLowpass = true
dreadLowpassHz = 2500
// Diegetic instruments (display only, never real data): portrait static, navball/altimeter jitter on signal dropouts, IVA light dips.
dreadInstruments = true
dreadPortraitStatic = true
dreadInstrumentJitter = true
// false: the navball is never jittered and always shows true attitude (near the swarm it is what you fly by). true: the older navball jitter on dropouts.
dreadNavballJitter = false
dreadIvaLights = true
// Director events (tears, freezes, dropouts, creaks, thumps, hull silence, portrait static) and rare false alarms at low menace.
dreadEvents = true
dreadFalseAlarms = true
// Monsters listen: during a release window a monster that has not charged lingers or falls back (never teleports).
dreadMonsterRelease = true
// Legacy dark rule: going dark (engines off and lights off) for this many seconds makes a monster that has not charged, and is over 150 m away, lose you. Ignored while huntAi is true (the hunt below replaces it).
dreadMonsterNoise = true
// Seconds of darkness before that happens.
dreadDarkLoseSeconds = 12
// Director random seed. 0 = different every session; any other number repeats the same event pattern.
dreadSeed = 0

// --- Moho creature hunt: it hunts from what it knows ---
// true: a monster keeps a belief of where the craft is (a point and an error radius). It hears noises (engine, RCS, lights, landing
// impact, wheels, decoupling) and sees the craft only with a clear line of sight inside the ranges below. A monster that heard something
// walks to where it heard it, sweeps the area in an expanding pattern with stops to listen, and gives up if nothing new comes.
// A craft that goes silent while searched may escape; thrusting or driving gives it away. The body always faces its direction of travel
// (limited turn rate, turns before moving off); only the head, if the model has one, looks at the craft, and only while it is in sight.
// This replaces the original straight-line chase and the dark rule (dreadMonsterNoise / dreadDarkLoseSeconds).
// false: those return, exactly as before.
huntAi = true
// Seconds of searching without any new information before the monster gives up and stands down.
huntGiveUpSeconds = 120
// A freshly spawned Moho creature heads for the area of the craft (its first guess is up to this many metres off) and searches there.
// It hunts only once it hears or sees you. 0: it waits where it spawned until it notices something itself (it may never find you).
mohoRumorMetres = 1500
// A craft with more parts than this survives the strike and the creature leaves. 0: no limit, every craft it reaches is torn apart.
mohoMaxKillParts = 0
// Hearing range in metres at full loudness (the range shrinks in proportion to the loudness). Lights are seen, so they also need line of sight.
huntHearThrottleMetres = 4000
huntHearRcsMetres = 1200
huntHearLightsMetres = 1800
huntHearImpactMetres = 8000
huntHearWheelsMetres = 1500
huntHearDecoupleMetres = 5000
// Every noise, and lights in line of sight, carries at least this far however quiet it is (louder ones carry further, as above). 0: range times loudness only.
huntHearMinMetres = 1500
// Without any noise or light it spots a craft in line of sight only up to huntNoticeMetres; once it hunts it keeps sight up to huntSightMetres.
huntNoticeMetres = 300
huntSightMetres = 1500
// Largest yaw rate in degrees per second. With huntNaturalTurn the turn radius, not this, is what normally limits it (see below).
huntTurnDegPerSecond = 100
// Natural turning: a monster has a heading and a speed, moves only along the heading, and the goal only steers the heading.
// It cannot turn on the spot: the yaw rate is at most speed / radius, and the radius grows with speed (a sprint turn is a huge sweep).
// A big change of direction eases the speed off (never below huntTurnCreepSpeed, so it keeps moving), sweeps round in an arc and speeds up as it
// comes onto the new line. false: the old behaviour (turns on the spot, runs away straight off the craft, speed gated by alignment).
huntNaturalTurn = true
// Turn radius in metres at a standstill, plus this much per m/s of speed (22 m/s: 56 m, 120 m/s sprint: 252 m).
huntTurnRadiusMetres = 12
huntTurnRadiusPerSpeed = 2.0
// How fast the yaw rate may change, degrees per second squared.
huntTurnYawAccelDegPerSecond2 = 30
// Lowest speed (m/s) while it still has to turn and has somewhere to go.
huntTurnCreepSpeed = 5
// Fraction of the wanted speed kept at a large misalignment (110 degrees or more).
huntTurnEaseFloor = 0.45
// Turn radius (and creep speed) factor for smaller ground creatures (none at present; the Moho creature uses 1).
huntTurnSmallBodyScale = 0.3
// Moho creature body while turning: lean into the arc, chest and shoulders lead and the pelvis follows, outer feet take longer strides. false: upright as before.
mohoTurnLean = true
mohoTurnLeanMaxDeg = 14
// Moho creature worm body: gpu (thousands of worms simulated on the graphics card; they burrow when the creature moves fast and catch by ambush; needs DirectX 11, falls back to heap),
// or heap (density-pile swarm).
mohoWormBody = gpu
// gpu body only. true: the swarm catches by ambush: about mohoAmbushDistance m from the craft it burrows, stays silent for mohoAmbushSilence s
// while it creeps under the craft, then erupts as a spire that seizes the craft (up to mohoSpireMaxHeight m up) and drags it into the ground.
// It aims at the craft's centre of mass. A craft that gets more than mohoAmbushReach m away (sideways) or higher than the spire during the silence is missed. false: the old catch.
mohoWormAmbush = true
// true: a strike that catches nothing forms no ball; every worm goes straight to the limp heap, then the hunt goes on. false: the old miss (ball/mound, drop, settle).
mohoAmbushMissHeap = true
// 0..1: the eruption spire leans, sways and rises irregularly (layered noise, hesitations, surges; catch and miss unchanged). 0: the old regular motion.
mohoSpireIrregular = 1
// 0..1: the ball/mound is lumpy and uneven (slow low-frequency bulges, uneven churn, no spikes). 0: the old round ball.
mohoBallIrregular = 1
// 0..1: the spire's worms break ranks: each hangs off the column its own way, writhes, a fifth lash far out, and now and then one drops off and climbs back. 0: the old exact column.
mohoGrabChaos = 1
// true: after the grab the arm collapses onto the craft (dragging a seized craft down) into a writhing mound, and the craft blows up inside it. false: the old ball, drop and settle.
mohoGrabCollapse = true
// how the craft dies at the end of the collapse. auto: every remaining part dies in one frame (Volumetric Explosion FX draws one blast if it is installed; it is never required), else our own vacuum blast (flash, light, hot ball, sparks). stock: the stock explosions. off: the old quiet kill.
mohoKillBlast = auto
// true: the blast throws the strike's worms out and up (closest fastest), and they crawl back into the heap. Strength by the craft's propellant, at most mohoKillFlingMax m/s (Moho: 15 m/s throws a worm up to ~80 m).
mohoKillFling = true
mohoKillFlingMax = 15
// size of our own blast's fireball, flash and light (1 = full, 0.5 = half, 0 = no fireball; the worms' throw is separate). Without Volumetric Explosion FX only.
mohoKillBlastSize = 0.35
// how hard the blast throws the worms (1 = full, 0.75 = 75%, 0 = not at all); the explosion's size is not changed.
mohoKillFlingStrength = 0.6
mohoAmbushDistance = 150
mohoAmbushSilence = 2.5
mohoAmbushReach = 25
mohoSpireMaxHeight = 45
// The spire reaches mohoSpireMaxHeight times this (2 = 90 m; 1 = the old 45 m) ...
mohoSpireHeightScale = 2
// ... and a craft it seizes in the air is slammed down to the ground (fast drop, big dust ring, hard shake). false = the old haul-down.
mohoSpireSmash = true
// Worm hunt strikes. true: the hidden creature creeps under the craft from the start of
// the dive: every worm digs in at once at three times the speed, and the hidden creature creeps off once nobody is left on top (at the latest
// after mohoAmbushDiveMax s), so no worm is stranded and switched off in sight. false: the old dive (up to 6 s, bottom layer first).
mohoWormQuickStrike = true
mohoAmbushDiveMax = 2.5
// Before the serpent sets off to strike, the heap digs in at most this long (s); otherwise it waits until half of it is under (at most 8 s).
mohoWormAttackDigIn = 1.5
// how fast the hidden creature creeps under the craft during the silence (m/s)
mohoAmbushUnderSpeed = 200
// true: parts the swarm takes are crushed and vanish; false: they explode (the game's own explosion effect)
mohoAmbushQuietKill = true
// gpu body: metres the worms' ground sits above the sampled terrain (the terrain collider where loaded). 0 = worms rest on the ground; 2 = the old look (they float). Raise it only if worms sink into the ground.
mohoWormGroundLift = 0
// gpu body: how stiffly each worm resists bending (0.3 = the old, stiffer bodies; lower = softer, they drape and curl more). The wriggle is not changed.
mohoWormBendStiffness = 0.15
// gpu body with the worm hunt: true: a dormant or fed heap churns in place (less pull toward its drifting centre, hardly any trail following,
// more circling) instead of all its worms combing one way. false: the old heap behaviour.
mohoWormCalmHeap = true
// gpu body: random bursts. At any moment this share of the worms (0 = off) is crawling mohoWormSpurtFast times faster or mohoWormSpurtSlow times
// slower, with the wiggle tempo changing alike (its width does not), for mohoWormSpurtSeconds; then each worm rolls again.
mohoWormSpurtShare = 0.12
mohoWormSpurtSeconds = 0.5
mohoWormSpurtFast = 2
mohoWormSpurtSlow = 0.5
// gpu body: true: worms are put back on the ground after the pile pushes them around, and ground not sampled yet (ahead of a fast creature) is guessed from the slope around it instead of holding the height of a place 192 m away. false: the old ground handling.
mohoWormGroundFix = true
// gpu body: true: a worm burrows head first; its head curves down into the soil and drags the body in after it, and only worms lying on the ground dig (the pile shrinks from the bottom). Rising worms come up the same way. false: the old dive (head straight down) and upright rise.
mohoWormTunnels = true
// gpu body: true: lit dust: soft dust puffs that light like 3D clouds from any side (hard sun, dark shadow side), sun-lit grit streaks, small tumbling rocks, and an ejecta curtain at the eruption. Ballistic, as in a vacuum. false: the old flat dots.
mohoWormDustLit = true
// gpu body lit dust: true: soft edges where dust meets the ground or a craft (turns on the camera's depth texture). false: hard edges.
mohoWormDustSoft = true
// gpu body lit dust: amount of dust (1 = normal, 0 = none) and brightness of the sun on it (1 = the scene's sun light)
mohoWormDustDensity = 1
mohoWormDustSun = 1
// gpu body lit dust: true: the worms make their own dust: soil thrown where bodies dig in or burst out of the ground, soil falling off worms that just came up (the dust on the spire). false: only the fixed sprays and the eruption curtain.
mohoWormDustFromWorms = true
// gpu body: true: while the creature travels fast, worms leap out of the ground ahead of it in dolphin arcs (the whole body rolls out and back in); false: only soil sprays mark its path. Off by default since the serpent.
mohoWormLeaps = false
// gpu body: true: travelling, the swarm moves as one huge serpent made of worms: it twists and waves up and down and side to side through the ground toward its target, breaking the surface and diving back under; before an attack it rises in one high arc and plunges straight down. false: the swarm travels hidden under the ground.
mohoWormSerpent = true
// gpu body serpent: length and thickest radius of the body (m), and the strength of its waves (1 = normal, 0 = straight)
mohoWormSerpentLength = 100
mohoWormSerpentRadius = 3.5
mohoWormSerpentWave = 1
// gpu body serpent: top travel speed (m/s); the sprint (mohoSprintSpeed) is capped to it so the body can be seen
mohoWormSerpentMaxSpeed = 55
// gpu body serpent: metres it runs under the dirt after setting off, so it breaks the surface away from the heap it dug out of (0 = it may surface at once, the old look)
mohoWormSerpentSubmerged = 70
// gpu body serpent: true: when it stops, the body sinks under the dirt on the spot and the worms come up head first around it as a heap. false: the body lets go and slumps onto the ground.
mohoWormSerpentSink = true

// --- Moho worm swarm hunt (gpu body with mohoWormAmbush).
// The swarm is blind and Moho has no air: it feels only what travels through the ground. A craft in the air is invisible to it.
// true: this hunt (ground-only senses; dormant heap, alert, search, attack, scramble, wander, fed). false: the old hunt (huntHear*, DreadHunt).
mohoWormHunt = true
// Spawn: one swarm at a time, about this far from the active vessel (+-15%), where it can't be seen appearing (mohoSpawnHidden); only
// while the craft is at most mohoWormSpawnMaxHeight above the ground (no 10 m rule: a craft coming in to land can see it).
mohoWormSpawnMetres = 5000
// m above the ground under the craft (measured on the planet's height map, not above sea level)
mohoWormSpawnMaxHeight = 5000
// true: Moho is never safe: whenever no creature is out and the craft is low enough, the swarm spawns (checked every 2 s; no chance roll,
// no cooldown). If no hidden place exists (a craft high up sees most of the ground), it spawns just out of the camera's view, else anywhere
// at that distance. false: the random encounter rolls above decide (bulkEncounterChance every randomCheckSeconds).
mohoWormAlwaysSpawn = true
// It goes away only when the active vessel is farther than this (m).
mohoWormDespawnMetres = 10000
// Speeds (m/s): a dormant (or fed) heap, a heap searching round a landing, a heap wandering after a missed strike, the serpent searching after a miss.
// The serpent's travel speed (alerted, attack) is mohoWormSerpentMaxSpeed.
wormDormantSpeed = 2
wormSearchSpeed = 8
wormWanderSpeed = 4
// A dormant or fed heap stays where it settled: it roams only inside a circle of this radius (m) round that spot (its worms trail in long lines
// as it moves, but it never wanders off). 0 = the old free drift.
wormDormantLeash = 60
// With mohoWormCalmHeap: the radius (m) a resting heap's worms spread over (a moving heap keeps 20 m). Worms going farther than ~145 m
// from the creature dig in (head first, in sight) and come up again near it; nothing vanishes above ground.
mohoWormDormantSpread = 40
// A crawling heap is only as fast as its worms: once the centre of its worms trails the creature by more than this (m) it slows down, to a fifth
// at twice this, and waits for them (a safety net: with wormHeapRollMetres it should rarely act). 0 = off.
wormHeapTrailSoft = 50
// While the heap searches or wanders, worms far from its centre hurry this many times more (1 = like any heap), so a fast search looks frantic.
mohoWormSearchHurry = 2
// A searching or wandering heap rolls: worms more than this far (m) from its centre dig in head first, in sight, and come up again near it, so the
// heap keeps up with its 8 m/s search (worms only crawl ~1.5 m/s on average). 0 = off: they only crawl and the heap waits.
wormHeapRollMetres = 40
wormScrambleSerpentSpeed = 25
// A touchdown alerts it at any range: it travels as the serpent to a random point this far from the craft (m), comes up as a heap and searches.
wormAlertMinMetres = 500
wormAlertMaxMetres = 1500
// Search: as a heap it closes in, then wanders inside a circle of this diameter (m) round the craft. After wormSearchGiveUpSeconds inside the circle with nothing, it wanders off (0 = never).
wormSearchCircleMetres = 500
wormSearchGiveUpSeconds = 240
// What gives you away (ranges in m; the player is never told these). A landed craft or a Kerbal on the ground this close to the heap is spotted at once and struck on the spot (no serpent).
wormFeelPresenceMetres = 100
// A touchdown at up to wormTouchdownSoftSpeed m/s is spotted within wormFeelTouchdownMetres; harder landings are felt farther, reaching wormFeelExplosionMetres at wormTouchdownHardSpeed m/s.
wormFeelTouchdownMetres = 1000
wormTouchdownSoftSpeed = 10
wormTouchdownHardSpeed = 40
// Engines running with the lowest part less than wormHoverHeight m above the ground (or landed).
wormHoverHeight = 15
wormFeelHoverMetres = 500
// RCS fired while landed; something else hitting the ground (debris, a Kerbal hopping).
wormFeelRcsMetres = 500
wormFeelImpactMetres = 500
// Drills running while landed; any part exploding (not the swarm's own kills).
wormFeelDrillMetres = 1750
wormFeelExplosionMetres = 3000
// Driving on wheels while landed (not in the design's table; a landed craft's system).
wormFeelWheelsMetres = 500
// Locked on after spotting: the strike follows the craft unless it moved this far (m) sideways from where the lock began.
wormLockEscapeMetres = 100
// The serpent's final burrow before a strike goes into the ground mohoAmbushDistance m from the craft. Its rising arc carries it on for about this
// many seconds at travel speed (~45 m at 55 m/s), so it starts the strike that much earlier. 0 = start at mohoAmbushDistance (burrows ~100 m out).
wormPlungeLeadSeconds = 0.85
// After a missed strike: a heap for wormScrambleHeapSeconds, then the serpent searches within wormScrambleRadius m for wormScrambleSerpentSeconds, then a heap wanders for wormWanderSeconds, then dormant.
wormScrambleHeapSeconds = 10
wormScrambleSerpentSeconds = 20
wormScrambleRadius = 300
wormWanderSeconds = 60
// Science loop (parts in GameData/UnkerbalThings/Parts). The heavy proximity scanner works within wormScanMetres (straight-line) of the heap and
// needs wormScanSeconds in range after the scan starts (leaving the range aborts it). Its readout shows its working range and your distance.
wormScanMetres = 50
wormScanSeconds = 30
// Photos and energy signatures while not landed, within these distances of the swarm (m).
wormPhotoMetres = 300
wormEnergyMetres = 150
// Every worm experiment takes time: its condition must hold the whole run (a lapse aborts it). Seconds per run (the scan's is wormScanSeconds above).
// Seismic readings need the craft landed the whole time, which is what makes them dangerous.
wormPhotoSeconds = 10
wormEnergySeconds = 15
wormSeismicSeconds = 30
wormStudyRunSeconds = 15
// The spotter works below this altitude above the ground (m); its range is unlimited.
wormSpotterMaxAltitude = 5000
// The swarm messes with electronics. true: science readouts are approximate (compass sector, rounded range), drift, garble and scroll
// as a ticker, worse the closer the swarm is: full interference inside wormReadoutNoiseNear m, none beyond wormReadoutNoiseFar m.
// Each part's shielding (its cfg) holds some of it back; the big parts are mostly shielding. false: exact readouts as before.
wormReadoutNoise = true
wormReadoutNoiseNear = 100
wormReadoutNoiseFar = 2500
// The view near the swarm (Dread/ViewLock.cs; needs dreadEnabled and dreadScreen for the picture effects). true: within viewLockPullMetres of
// the swarm the outside camera drowns in static and goes black over viewLockFadeSeconds; a craft with a Swarm Imager then switches to
// the imager's camera feed (1980s colour TV look that wears down as the swarm closes in, slow pan/tilt head, cut to black during an eruption). Beyond viewLockReleaseMetres
// the outside view comes back over viewLockRecoverSeconds. The feed can also be entered from the imager's part menu at any time.
// false: the outside view is never taken away and the feed only opens by hand.
viewLock = true
viewLockPullMetres = 1000
viewLockReleaseMetres = 1300
viewLockFadeSeconds = 4
viewLockRecoverSeconds = 2
// true: a kerbal on EVA near the swarm sees through their own eyes (first person, clear). false: static and black like a craft without imager.
viewLockEvaFirstPerson = true
// true: IVA is always clear (kerbals look through the windows; no Dread screen effects there). false: the older IVA screen effects.
viewLockIvaClear = true
// Overexposure of the feed (0..1): Moho is close to the sun, bright surfaces blow out to white.
viewFeedBlow = 0.5
// true: TUFX post-processing is switched off while the imager feed is on (auto-exposure profiles wash out the feed), and put back after.
viewFeedTufxOff = true
// Behaviour study: possible this many seconds after the seismic signal generator fired, once the swarm came for it.
wormStudySeconds = 180
// Steepest slope (rise over run) a monster will walk; steeper ground and the sea are walked round.
huntMaxSlope = 1.1
// true: the head turns toward a craft in sight, if the model has a head bone. false: no head movement.
huntHeadLook = true

// --- Moho/Eve creature: sprint, leaps, warnings, hidden spawn (sprint unit). Each switch off restores the older behaviour. ---
// Sprint: in Hunt with sight (or a fresh close belief) it eases up to mohoSprintSpeed m/s at mohoSprintAccel m/s2.
mohoSprint = true
mohoSprintSpeed = 180
mohoSprintAccel = 30
// It runs at least this fast (m/s) whenever it moves, except while it searches an area (then it walks). Above mohoGallopFromSpeed: a gallop. 0: off.
mohoRunSpeed = 60
// The walk turns into a gallop above this speed (m/s).
mohoGallopFromSpeed = 36
// Leaps under the body's real gravity (mohoGravityScale 1 = real). The final catch leap goes for a craft that has just taken off or hovers
// up to mohoLeapMaxHeight above the terrain (reaches at least mohoLeapMinHeight up); higher than that it cannot reach. While sprinting it
// also makes an occasional running leap (peak between min and mohoRunLeapMaxHeight, on average one every mohoRunLeapEverySeconds, and over rises).
mohoLeaps = true
mohoLeapMinHeight = 160
mohoLeapMaxHeight = 240
mohoRunLeapMaxHeight = 280
mohoRunLeapEverySeconds = 14
mohoLeapAirSpeed = 180
mohoGravityScale = 1
// Staged warnings once per chase at 100%, 60% and 20% of the radius (default 2.5 km, 1.5 km, 500 m). Landed: tremor, shake, instruments; in flight: instruments and signal only.
mohoWarnings = true
mohoWarnText = true
mohoWarnRadiusMetres = 2500
// Spawns only where it has no line of sight and is outside the camera frustum (tested with its 65 m height); otherwise the spawn waits. It leaves by running out of sight.
mohoSpawnHidden = true
mohoLeaveRunning = true
// Footsteps follow the creature's real footfalls instead of a timer.
mohoStepsFromFeet = true

// Skin: A dark, B near black. Length of the fish in metres.
leviathanLook = A
leviathanLengthMetres = 45
// Speed of the final rise, and the speed it must still have at the craft to destroy it (capped at 90 % of the rise speed). Slower contact does nothing.
bloopStrikeSpeed = 48
bloopKillSpeed = 34
leviathanScreamVolume = 1
// How far it can be seen in the water. Within this (30 % further with lights) and near the camera view it only turns slowly; sharp turns happen out of sight.
leviathanSightMetres = 70
// Its movement: a swim wave from head to tail, the backbone bent along the turn it swims, jaws that open in the rise and a little on the close pass.
// false: only the model's own swim clip, as before.
leviathanAnimations = true
// Tail beats per second = this x speed / tail swing. Higher: a faster beat at the same speed (real swimmers: 0.2 to 0.4).
leviathanTailStrouhal = 0.22
// A craft under way: it lays its circle around where the craft will be and keeps pace, weaves behind and below a fast craft instead of circling,
// overtakes it for the close pass and dives ahead of its course. false: every figure is laid around where the craft is now, as before.
bloopReactToMotion = true
// How fast it follows a craft that runs, and the most it swims outside the final rise (capped at 90 % of the rise speed). A faster craft gets away.
bloopChaseSpeed = 30
bloopPaceMaxSpeed = 38
// Where it hunts. On Laythe with True Volumetrics the water darkens almost linearly to black at bloopLightDepthMetres; 100 m is still bright.
bloopMinDepthMetres = 400
bloopLightDepthMetres = 1000
// It can destroy the craft, never sooner than this after it first noticed it (values under 180 are raised to 180), plus a random part of the spread.
bloopKillEarliestSeconds = 180
bloopKillSpreadSeconds = 90
